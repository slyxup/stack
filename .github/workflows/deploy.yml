name: "2. Deploy — Cloudflare (Workers + Pages)"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-auth:
    runs-on: ubuntu-latest
    # Deploy auth on every push to main (auth depends on @slyxup/core, so package changes must redeploy)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter auth.slyxup.online run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-stack:
    runs-on: ubuntu-latest
    # Stack now includes dynamic dashboard (/dashboard/[projectId]) — deploy via opennextjs-cloudflare (Workers).
    # Static export (out/) no longer used — dashboard needs SSR (projectId is dynamic).
    # Project: stack-slyxup-online → https://stack-slyxup-online.pages.dev + custom domain stack.slyxup.online
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter stack.slyxup.online run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-billing:
    runs-on: ubuntu-latest
    # Deploy billing on every push (depends on packages)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter billing.slyxup.online run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-examples:
    runs-on: ubuntu-latest
    # Examples are demo apps that showcase the SDKs — always deploy on main so demos are latest SDK version
    # Uses workspace:* so they automatically pick up the latest published SDKs via turbo build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx wrangler pages deploy examples/nextjs/out --project-name=example-nextjs --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler pages deploy examples/react/dist --project-name=example-react --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
