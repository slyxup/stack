name: Deploy (CF Workers + Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-auth:
    runs-on: ubuntu-latest
    # run if auth, packages, or billing changed (auth depends on core)
    if: contains(toJSON(github.event.head_commit.modified), 'auth.slyxup.online/') || contains(toJSON(github.event.head_commit.added), 'auth.slyxup.online/') || contains(toJSON(github.event.commits), 'auth')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter auth.slyxup.online run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-stack:
    runs-on: ubuntu-latest
    # Stack is marketing Pages — STATIC via Workers assets (modern Pages). Always deploy on main so marketing latest.
    # Note: This is Pages (marketing design etc), NOT Worker logic — uses assets: .next, deploys via wrangler.
    # If you see "Authentication error /zones/.../workers/routes [10000]", update CLOUDFLARE_API_TOKEN at
    # https://dash.cloudflare.com/profile/api-tokens → Create Token → Edit Cloudflare Workers template + add Zone:Read + Workers Routes:Edit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter stack.slyxup.online build
      - run: npx wrangler deploy --config stack.slyxup.online/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-billing:
    runs-on: ubuntu-latest
    if: contains(toJSON(github.event.head_commit.modified), 'billing.slyxup.online/')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter billing.slyxup.online run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
