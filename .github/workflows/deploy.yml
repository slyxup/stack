name: Deploy (CF Workers + Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-auth:
    runs-on: ubuntu-latest
    # run if auth, packages, or billing changed (auth depends on core)
    if: contains(toJSON(github.event.head_commit.modified), 'auth.slyxup.online/') || contains(toJSON(github.event.head_commit.added), 'auth.slyxup.online/') || contains(toJSON(github.event.commits), 'auth')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter auth.slyxup.online run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-stack:
    runs-on: ubuntu-latest
    # Stack is MARKETING ONLY — Pages (NOT Worker). Deploys static Next.js to Cloudflare Pages.
    # Uses `wrangler pages deploy` with project `stack-slyxup-online` → https://stack-slyxup-online.pages.dev + custom domain stack.slyxup.online
    # Always deploy on main so marketing latest. Worker `auth` and `billing` are separate.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter stack.slyxup.online build
      - run: npx wrangler pages deploy stack.slyxup.online/.next --project-name=stack-slyxup-online --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-billing:
    runs-on: ubuntu-latest
    if: contains(toJSON(github.event.head_commit.modified), 'billing.slyxup.online/')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter billing.slyxup.online run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
