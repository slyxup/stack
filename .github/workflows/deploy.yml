name: Deploy (CF Workers)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-auth:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'auth.slyxup.online/')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # uses packageManager from package.json (pnpm@9.0.0) — no version key to avoid ERR_PNPM_BAD_PM_VERSION
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter auth.slyxup.online deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
