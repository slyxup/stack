name: "1. CI — Verify (Lint, Typecheck, Build & Test)"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      # Uses the pinned packageManager from package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (biome)
        run: pnpm lint

      - name: Build (turbo)
        run: pnpm build

      - name: Test
        run: pnpm test
      - name: Real D1 and Worker runtime regressions
        run: pnpm test:runtime

      - name: Validate local migrations
        run: |
          pnpm --filter auth db:migrate:local
          pnpm --filter billing db:migrate:local

      - name: Wrangler types check
        run: pnpm cf:typegen

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
