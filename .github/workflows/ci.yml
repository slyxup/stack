name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      # uses packageManager from package.json (pnpm@9.0.0) — no version key to avoid ERR_PNPM_BAD_PM_VERSION

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (biome)
        run: pnpm lint

      - name: Build (turbo)
        run: pnpm build

      - name: Test
        run: pnpm test --if-present

      - name: Drizzle check (no drift)
        run: pnpm --filter auth.slyxup.online exec drizzle-kit generate --help 2>&1 | grep -q "generate" && echo "drizzle-kit available" || echo "migrations need generate"

      - name: Wrangler types check
        run: pnpm cf:typegen 2>&1 | head -n 50

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
