name: "3. Release — NPM Publish on Push"

on:
  push:
    branches: [main]

concurrency: release

jobs:
  release:
    if: github.repository == 'slyxup/stack'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Version packages (consume changesets, commit + push)
        run: |
          git config user.name "slyxup-bot"
          git config user.email "bot@users.noreply.github.com"
          pnpm changeset version
          if git diff --quiet; then
            echo "No version changes."
          else
            git commit -am "chore: version packages [skip ci]"
            git push
          fi
      - name: Publish to npm
        run: pnpm changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Sync local main after version commit
        run: git pull --rebase origin main || true
