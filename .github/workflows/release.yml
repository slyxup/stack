name: "3. Release — NPM Publish on Push"

on:
  push:
    branches: [main]

concurrency: release

jobs:
  release:
    if: github.repository == 'slyxup/stack'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Version & publish changed packages
        run: |
          git config user.name "slyxup-bot"
          git config user.email "bot@users.noreply.github.com"

          # Skip if this is already a version commit
          if git log -1 --pretty=%B | grep -q "chore: version packages"; then
            echo "Version commit, skipping."
            exit 0
          fi

          # Find which packages changed in this push
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -oP '^packages/\K[^/]+' | sort -u)
          if [ -z "$CHANGED" ]; then
            echo "No package changes, skipping."
            exit 0
          fi

          echo "Changed packages: $CHANGED"

          # For each changed package: get latest from npm, bump patch, publish
          for name in $CHANGED; do
            pkg="packages/$name"
            [ ! -d "$pkg" ] && continue

            pkg_name=$(node -p "require('./$pkg/package.json').name")
            echo ""
            echo "=== $pkg_name ==="

            # Get the current latest version from npm (may not exist yet)
            npm_latest=$(npm view "$pkg_name" version 2>/dev/null || echo "")
            if [ -n "$npm_latest" ]; then
              echo "  npm latest: $npm_latest"
              # Bump patch from npm latest (not from local package.json)
              IFS='.' read -r major minor patch <<< "$npm_latest"
              new_version="${major}.${minor}.$((patch + 1))"
            else
              # Package not on npm yet — use local version as-is
              local_ver=$(node -p "require('./$pkg/package.json').version")
              echo "  not on npm yet, using local version: $local_ver"
              new_version="$local_ver"
            fi

            echo "  publishing: $new_version"

            # Update local package.json version
            node -e "
              const fs=require('fs');
              const p='./$pkg/package.json';
              const j=JSON.parse(fs.readFileSync(p,'utf8'));
              j.version='$new_version';
              fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
            "

            # Check if this exact version already exists (race condition guard)
            exists=$(npm view "$pkg_name@$new_version" version 2>/dev/null || echo "")
            if [ -n "$exists" ]; then
              echo "  $pkg_name@$new_version already exists on npm, skipping."
              # Revert version in package.json
              git checkout -- "$pkg/package.json"
              continue
            fi

            # Publish with pnpm — auto-rewrites workspace:* → real versions
            (cd "$pkg" && pnpm publish --access public --no-git-checks --provenance) \
              && echo "  ✅ Published $pkg_name@$new_version" \
              || echo "  ❌ Publish failed for $pkg_name"
          done

          # Commit version bumps
          if ! git diff --quiet packages/*/package.json; then
            git add packages/*/package.json pnpm-lock.yaml
            git commit -m "chore: version packages" || true
            git push || echo "Push failed (protected branch), continuing..."
          fi

          echo ""
          echo "=== Published versions ==="
          for name in $CHANGED; do
            pkg_name=$(node -p "require('./packages/$name/package.json').name")
            echo "$pkg_name: $(npm view "$pkg_name" version 2>/dev/null || echo 'N/A')"
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
