name: "3. Release — Verified SDK packages"

on:
  workflow_dispatch:

concurrency: release

permissions:
  contents: read
  id-token: write

jobs:
  release:
    if: github.repository == 'slyxup/stack' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm build && pnpm test
      - run: pnpm test:runtime && pnpm audit --prod --audit-level high
      # Apply and review `pnpm exec changeset version` before merging the release.
      # Versions come from committed package manifests, never guessed from npm.
      - name: Publish versioned packages
        run: pnpm exec changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
